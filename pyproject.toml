[project]
name = "kstr-flow"
version = "0.1.0"
description = "Text-first Pythonic workflows embedded in ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
authors = [
  { name = "Yeol", email = "casiya03@gmail.com" },
]
keywords = ["comfyui", "workflow", "python", "node"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "typing_extensions>=4.8",
]

[project.urls]
Homepage = "https://github.com/Ye0l/KSTR-Flow"
Issues = "https://github.com/Ye0l/KSTR-Flow/issues"

[project.entry-points."comfyui.custom_nodes"]
kstr_flow = "kstr_flow.comfy_node"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kstr_flow"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests/kstr_flow"]
